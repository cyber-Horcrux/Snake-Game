    <polygon points="310,382 284,384 294,446" />

    <!-- Tail Base Clasp -->
    <polygon points="256,488 226,456 242,442 256,454 270,442 286,456" />

    <!-- Crown Contour Crest -->
    <path d="M 256,44 L 184,96 L 194,106 L 256,62 L 318,106 L 328,96 Z" />
  </g>
</svg>
