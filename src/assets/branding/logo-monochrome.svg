<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <!-- 
    NEON SNAKE — Monochrome 1-Color Vector Mark
    Designed with calibrated negative space cutouts for flawless reproduction
    in laser etching, single-color silk screening, and monochrome stencil masks.
  -->
  <g fill="#FFFFFF">
    <!-- Top Kinetic Directional Arrow -->
    <polygon points="256,76 226,124 244,132 256,114 268,132 286,124" />

    <!-- Forehead Ridge Segments -->
    <polygon points="240,146 272,146 278,172 234,172" />
    <polygon points="232,184 280,184 286,210 226,210" />

    <!-- Temple Armor Plates (Left & Right) -->
    <polygon points="194,106 242,126 226,176 150,154" />
    <polygon points="318,106 270,126 286,176 362,154" />

    <!-- Flared Hood Wings (Left & Right) -->
    <polygon points="138,168 212,188 194,244 112,230" />
    <polygon points="374,168 300,188 318,244 400,230" />

    <!-- Hexagonal Snout Armor Plate -->
    <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" />

    <!-- Cheeks & Lower Jaw Flanks -->
    <polygon points="112,256 160,268 144,324 100,286" />
    <polygon points="400,256 352,268 368,324 412,286" />

    <!-- Predator Optical Sensor Slits (Negative Eye Cutouts via Geometry) -->
    <polygon points="166,242 222,256 206,274 152,258" />
    <polygon points="346,242 290,256 306,274 360,258" />

    <!-- Articulated Collar Segments -->
    <path d="M 126,334 L 160,378 L 198,414 L 182,428 L 138,390 L 112,348 Z" />
    <path d="M 386,334 L 352,378 L 314,414 L 330,428 L 374,390 L 400,348 Z" />

