<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <!-- High-Contrast Gradients for Light Backgrounds -->
    <linearGradient id="lCyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3B4" />
      <stop offset="100%" stop-color="#007280" />
    </linearGradient>

    <linearGradient id="lMagentaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D8005A" />
      <stop offset="100%" stop-color="#B00045" />
    </linearGradient>

    <linearGradient id="lPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#090D18" />
    </linearGradient>
    <linearGradient id="lPlateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24304E" />
      <stop offset="100%" stop-color="#182238" />
    </linearGradient>
  </defs>

  <!-- EMBLEM: THE APEX CYBER-VIPER (Tuned for light background contrast) -->
  <g transform="translate(68, 16) scale(0.90)">
    <!-- Armor Shell -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
      fill="url(#lPlateDark)" stroke="#090D18" stroke-width="3" stroke-linejoin="round" />

    <!-- Left & Right Temple Shields -->
    <polygon points="194,106 242,126 226,176 150,154" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" stroke-linejoin="round" />
    <polygon points="318,106 270,126 286,176 362,154" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" stroke-linejoin="round" />

    <!-- Left & Right Hood Flairs -->
    <polygon points="138,168 212,188 194,244 112,230" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" stroke-linejoin="round" />
    <polygon points="374,168 300,188 318,244 400,230" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" stroke-linejoin="round" />

    <!-- Lower Jaw Flanks & Body Arcs -->
    <polygon points="112,256 160,268 144,324 100,286" fill="url(#lPlateDark)" stroke="#090D18" stroke-width="1.5" />
    <polygon points="400,256 352,268 368,324 412,286" fill="url(#lPlateDark)" stroke="#090D18" stroke-width="1.5" />
    <path d="M 126,334 L 160,378 L 198,414 L 182,428 L 138,390 L 112,348 Z" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" />
    <path d="M 386,334 L 352,378 L 314,414 L 330,428 L 374,390 L 400,348 Z" fill="url(#lPlateMid)" stroke="#334168" stroke-width="2" />
    <polygon points="256,488 226,456 242,442 256,454 270,442 286,456" fill="#6B21A8" stroke="#581C87" stroke-width="2" stroke-linejoin="round" />

    <!-- Kinetic Spine Chevrons -->
    <polygon points="256,76 226,124 244,132 256,114 268,132 286,124" fill="url(#lCyberCyan)" stroke="#00C4D6" stroke-width="1.5" stroke-linejoin="round" />
    <polygon points="240,146 272,146 278,172 234,172" fill="#0C1324" stroke="url(#lCyberCyan)" stroke-width="2" />
    <line x1="256" y1="146" x2="256" y2="172" stroke="#00C4D6" stroke-width="2" />
    <polygon points="232,184 280,184 286,210 226,210" fill="#0C1324" stroke="url(#lCyberCyan)" stroke-width="2" />
    <line x1="256" y1="184" x2="256" y2="210" stroke="#00C4D6" stroke-width="2" />

    <!-- Snout Hexagon Plate -->
    <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" fill="#0A0E1A" stroke="url(#lCyberCyan)" stroke-width="2.5" />
    <line x1="256" y1="230" x2="256" y2="330" stroke="#00C4D6" stroke-width="2" />
    <circle cx="256" cy="330" r="3" fill="#00A3B4" />

    <!-- Predator Optical Sensors (Eyes) -->
    <polygon points="164,238 226,252 208,276 150,260" fill="#090D18" stroke="#D8005A" stroke-width="2" />
    <polygon points="172,246 218,256 204,270 160,258" fill="url(#lMagentaLaser)" />
    <polygon points="186,250 200,254 192,264 182,260" fill="#FFF0F5" />

    <polygon points="348,238 286,252 304,276 362,260" fill="#090D18" stroke="#D8005A" stroke-width="2" />
    <polygon points="340,246 294,256 308,270 352,258" fill="url(#lMagentaLaser)" />
    <polygon points="326,250 312,254 320,264 330,260" fill="#FFF0F5" />

    <!-- Fangs -->
    <polygon points="202,382 228,384 218,446" fill="#F8FAFC" stroke="url(#lCyberCyan)" stroke-width="2" />
    <line x1="216" y1="384" x2="218" y2="440" stroke="#00A3B4" stroke-width="2" stroke-linecap="round" />
    <circle cx="218" cy="442" r="2" fill="#00A3B4" />

    <polygon points="310,382 284,384 294,446" fill="#F8FAFC" stroke="url(#lCyberCyan)" stroke-width="2" />
    <line x1="296" y1="384" x2="294" y2="440" stroke="#00A3B4" stroke-width="2" stroke-linecap="round" />
    <circle cx="294" cy="442" r="2" fill="#00A3B4" />

    <!-- Contour Strokes -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310" stroke="url(#lCyberCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 256,44 L 328,96 L 372,150 L 406,218 L 420,252 L 386,310" stroke="url(#lCyberCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 228,386 L 256,348 L 284,386" stroke="#6B21A8" stroke-width="2.5" fill="none" />
  </g>

  <!-- WORDMARK (High contrast for light surfaces) -->
  <g id="light-wordmark">
    <text x="300" y="525" text-anchor="middle" font-family="'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="52" letter-spacing="0.22em" fill="#0F172A">
      <tspan fill="#008B99">NEON</tspan> <tspan fill="#0F172A">SNAKE</tspan>
    </text>

    <!-- Divider Beam -->
    <g transform="translate(110, 552)">
      <line x1="0" y1="0" x2="380" y2="0" stroke="#CBD5E1" stroke-width="2" />
      <line x1="120" y1="0" x2="260" y2="0" stroke="#008B99" stroke-width="2.5" />
      <polygon points="190,-4 195,0 190,4 185,0" fill="#008B99" />
    </g>

    <!-- Tagline: [ ── ONE MORE RUN ── ] -->
    <g transform="translate(300, 610)">
      <path d="M -180,-14 L -194,-14 L -194,14 L -180,14" stroke="#008B99" stroke-width="2.5" fill="none" />
      <circle cx="-194" cy="0" r="2" fill="#008B99" />
      <text x="0" y="6" text-anchor="middle" font-family="'Rajdhani', 'Orbitron', sans-serif" font-weight="700" font-size="24" letter-spacing="0.38em" fill="#334155">
        ONE MORE RUN
      </text>
      <path d="M 180,-14 L 194,-14 L 194,14 L 180,14" stroke="#008B99" stroke-width="2.5" fill="none" />
      <circle cx="194" cy="0" r="2" fill="#008B99" />
    </g>

    <text x="300" y="662" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.45em" fill="#64748B">
      ARCADE PROTOCOL // 2.0 VERIFIED
    </text>
  </g>
</svg>
