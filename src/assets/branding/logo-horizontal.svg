<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Neon Gradients -->
    <linearGradient id="hCyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43F5FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <!-- Magenta Eye Laser Gradients -->
    <linearGradient id="hMagentaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="100%" stop-color="#FF4FD8" />
    </linearGradient>

    <!-- Plate Shading Gradients -->
    <linearGradient id="hPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C34" />
      <stop offset="100%" stop-color="#090E1D" />
    </linearGradient>
    <linearGradient id="hPlateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E284A" />
      <stop offset="100%" stop-color="#0F1528" />
    </linearGradient>

    <filter id="hNeonBloom" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left: The Apex Cyber-Viper Emblem (Scaled to 150px height, centered vertically) -->
  <g transform="translate(18, 12) scale(0.305)">
    <!-- Armor Shell -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
      fill="url(#hPlateDark)" stroke="#1F2B4C" stroke-width="3" stroke-linejoin="round" />

    <!-- Left & Right Temple Shields -->
    <polygon points="194,106 242,126 226,176 150,154" fill="url(#hPlateMid)" stroke="#2D3E6E" stroke-width="2" />
    <polygon points="318,106 270,126 286,176 362,154" fill="url(#hPlateMid)" stroke="#2D3E6E" stroke-width="2" />

    <!-- Hood Flairs -->
    <polygon points="138,168 212,188 194,244 112,230" fill="url(#hPlateMid)" stroke="#2D3E6E" stroke-width="2" />
    <polygon points="374,168 300,188 318,244 400,230" fill="url(#hPlateMid)" stroke="#2D3E6E" stroke-width="2" />

    <!-- Kinetic Spine & Chevrons -->
    <polygon points="256,76 226,124 244,132 256,114 268,132 286,124" fill="url(#hCyberCyan)" stroke="#A5F9FF" stroke-width="1.5" />
    <polygon points="240,146 272,146 278,172 234,172" fill="#0C1326" stroke="url(#hCyberCyan)" stroke-width="2" />
    <line x1="256" y1="146" x2="256" y2="172" stroke="#43F5FF" stroke-width="2" />
    <polygon points="232,184 280,184 286,210 226,210" fill="#0C1326" stroke="url(#hCyberCyan)" stroke-width="2" />
    <line x1="256" y1="184" x2="256" y2="210" stroke="#43F5FF" stroke-width="2" />

    <!-- Snout Hexagon -->
    <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" fill="#090E1D" stroke="url(#hCyberCyan)" stroke-width="2.5" />
    <line x1="256" y1="230" x2="256" y2="330" stroke="#A5F9FF" stroke-width="2" />

    <!-- Eyes -->
    <polygon points="164,238 226,252 208,276 150,260" fill="#060812" stroke="#FF007A" stroke-width="2" />
    <polygon points="172,246 218,256 204,270 160,258" fill="url(#hMagentaLaser)" />
    <polygon points="186,250 200,254 192,264 182,260" fill="#FFFFFF" />

    <polygon points="348,238 286,252 304,276 362,260" fill="#060812" stroke="#FF007A" stroke-width="2" />
    <polygon points="340,246 294,256 308,270 352,258" fill="url(#hMagentaLaser)" />
    <polygon points="326,250 312,254 320,264 330,260" fill="#FFFFFF" />

    <!-- Fangs -->
    <polygon points="202,382 228,384 218,446" fill="#F0F8FF" stroke="url(#hCyberCyan)" stroke-width="2" />
    <polygon points="310,382 284,384 294,446" fill="#F0F8FF" stroke="url(#hCyberCyan)" stroke-width="2" />

    <!-- Neon Contour Highlights -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310" stroke="url(#hCyberCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 256,44 L 328,96 L 372,150 L 406,218 L 420,252 L 386,310" stroke="url(#hCyberCyan)" stroke-width="3" stroke-linecap="round" />
    <path d="M 228,386 L 256,348 L 284,386" stroke="#9865FF" stroke-width="2.5" fill="none" />
  </g>

  <!-- Vertical Dividing Cyber Notch Beam -->
  <g transform="translate(192, 28)">
    <line x1="0" y1="0" x2="0" y2="124" stroke="#1D2A4C" stroke-width="2" />
    <line x1="0" y1="36" x2="0" y2="88" stroke="#43F5FF" stroke-width="2.5" />
    <polygon points="-4,62 0,58 4,62 0,66" fill="#43F5FF" />
  </g>

  <!-- Right: Wordmark & Tagline -->
  <g transform="translate(222, 0)">
    <!-- NEON SNAKE Primary Title -->
    <text x="0" y="88" font-family="'Orbitron', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="52" letter-spacing="0.14em" fill="#FFFFFF" filter="url(#hNeonBloom)">
      <tspan fill="url(#hCyberCyan)">NEON</tspan> <tspan fill="#F8FAFC">SNAKE</tspan>
    </text>

    <!-- Tagline: [ ── ONE MORE RUN ── ] -->
    <g transform="translate(0, 134)">
      <path d="M 0,-12 L -8,-12 L -8,10 L 0,10" stroke="#43F5FF" stroke-width="2" fill="none" />
      <text x="12" y="3" font-family="'Rajdhani', 'Orbitron', sans-serif" font-weight="700" font-size="20" letter-spacing="0.32em" fill="#A5B4FC">
        ONE MORE RUN
      </text>
      <path d="M 276,-12 L 284,-12 L 284,10 L 276,10" stroke="#43F5FF" stroke-width="2" fill="none" />
    </g>

    <!-- Micro telemetry tag -->
    <text x="350" y="137" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.25em" fill="#475569">
      // VERIFIED
    </text>
  </g>
</svg>
