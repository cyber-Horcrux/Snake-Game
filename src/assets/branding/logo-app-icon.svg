<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="iconBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#101730" />
      <stop offset="55%" stop-color="#080C1A" />
      <stop offset="100%" stop-color="#04060C" />
    </radialGradient>

    <!-- Cyan Neon Gradients -->
    <linearGradient id="iCyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55F7FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Magenta Eye Laser Gradients -->
    <linearGradient id="iMagentaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#FF70BA" />
    </linearGradient>

    <!-- Plate Shading Gradients -->
    <linearGradient id="iPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C36" />
      <stop offset="100%" stop-color="#080C1A" />
    </linearGradient>
    <linearGradient id="iPlateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2A4E" />
      <stop offset="100%" stop-color="#0E1528" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="iNeonBloom" x="-25%" y="-25%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="iEyeGlow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="5" result="eyeBlur" />
      <feMerge>
        <feMergeNode in="eyeBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Backing Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#iconBg)" />
  
  <!-- Subtle Outer Border (Chamfer Ring) -->
  <rect x="8" y="8" width="496" height="496" rx="88" stroke="#182342" stroke-width="3" fill="none" />
  
  <!-- Corner Accent Lasers -->
  <path d="M 40,88 L 88,40 M 424,40 L 472,88 M 40,424 L 88,472 M 424,472 L 472,424" stroke="#43F5FF" stroke-width="2" opacity="0.4" />

  <!-- The Apex Viper Emblem (Centered within Android Safe Zone ~72% scale) -->
  <g transform="translate(82, 60) scale(0.68)">
    <!-- Ambient Under-Glow Aura -->
    <g opacity="0.45" filter="url(#iNeonBloom)">
      <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
        stroke="#00F5FF" stroke-width="8" fill="none" />
    </g>

    <!-- Armor Shell -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
      fill="url(#iPlateDark)" stroke="#223156" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Left & Right Temple Shields -->
    <polygon points="194,106 242,126 226,176 150,154" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="318,106 270,126 286,176 362,154" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />

    <!-- Hood Flairs -->
    <polygon points="138,168 212,188 194,244 112,230" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="374,168 300,188 318,244 400,230" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />

    <!-- Lower Jaw Flanks & Body Arcs -->
    <polygon points="112,256 160,268 144,324 100,286" fill="url(#iPlateDark)" stroke="#223156" stroke-width="2" />
    <polygon points="400,256 352,268 368,324 412,286" fill="url(#iPlateDark)" stroke="#223156" stroke-width="2" />
    <path d="M 126,334 L 160,378 L 198,414 L 182,428 L 138,390 L 112,348 Z" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <path d="M 386,334 L 352,378 L 314,414 L 330,428 L 374,390 L 400,348 Z" fill="url(#iPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="256,488 226,456 242,442 256,454 270,442 286,456" fill="#7928CA" stroke="#A779E9" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Kinetic Spine Chevrons -->
    <polygon points="256,76 226,124 244,132 256,114 268,132 286,124"
      fill="url(#iCyberCyan)" stroke="#A5F9FF" stroke-width="2" stroke-linejoin="round" filter="url(#iEyeGlow)" />
    <polygon points="240,146 272,146 278,172 234,172" fill="#0C1326" stroke="url(#iCyberCyan)" stroke-width="2.5" />
    <line x1="256" y1="146" x2="256" y2="172" stroke="#43F5FF" stroke-width="2.5" />
    <polygon points="232,184 280,184 286,210 226,210" fill="#0C1326" stroke="url(#iCyberCyan)" stroke-width="2.5" />
    <line x1="256" y1="184" x2="256" y2="210" stroke="#43F5FF" stroke-width="2.5" />

    <!-- Snout Hexagon Plate -->
    <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" fill="#090E1D" stroke="url(#iCyberCyan)" stroke-width="3" />
    <line x1="256" y1="230" x2="256" y2="330" stroke="#A5F9FF" stroke-width="2.5" />
    <circle cx="256" cy="330" r="3.5" fill="#43F5FF" />

    <!-- Eyes (High Intensity Laser Slits) -->
    <g filter="url(#iEyeGlow)">
      <polygon points="164,238 226,252 208,276 150,260" fill="#060812" stroke="#FF007A" stroke-width="2.5" />
      <polygon points="172,246 218,256 204,270 160,258" fill="url(#iMagentaLaser)" />
      <polygon points="186,250 200,254 192,264 182,260" fill="#FFFFFF" />

      <polygon points="348,238 286,252 304,276 362,260" fill="#060812" stroke="#FF007A" stroke-width="2.5" />
      <polygon points="340,246 294,256 308,270 352,258" fill="url(#iMagentaLaser)" />
      <polygon points="326,250 312,254 320,264 330,260" fill="#FFFFFF" />
    </g>

    <!-- Fangs -->
    <polygon points="202,382 228,384 218,446" fill="#F0F8FF" stroke="url(#iCyberCyan)" stroke-width="2.5" />
    <line x1="216" y1="384" x2="218" y2="440" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="218" cy="442" r="2.5" fill="#43F5FF" filter="url(#iEyeGlow)" />

    <polygon points="310,382 284,384 294,446" fill="#F0F8FF" stroke="url(#iCyberCyan)" stroke-width="2.5" />
    <line x1="296" y1="384" x2="294" y2="440" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="294" cy="442" r="2.5" fill="#43F5FF" filter="url(#iEyeGlow)" />

    <!-- Neon Rim Strokes -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310" stroke="url(#iCyberCyan)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 256,44 L 328,96 L 372,150 L 406,218 L 420,252 L 386,310" stroke="url(#iCyberCyan)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 228,386 L 256,348 L 284,386" stroke="#9865FF" stroke-width="3" fill="none" />
  </g>
</svg>
