<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ogBgGlow" cx="30%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121A36" />
      <stop offset="50%" stop-color="#080C1A" />
      <stop offset="100%" stop-color="#04060C" />
    </radialGradient>

    <!-- Cyan Neon Gradients -->
    <linearGradient id="ogCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55F7FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0088FF" />
    </linearGradient>

    <!-- Magenta Eye Laser Gradients -->
    <linearGradient id="ogMagenta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#FF70BA" />
    </linearGradient>

    <!-- Plate Shading Gradients -->
    <linearGradient id="ogPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141C36" />
      <stop offset="100%" stop-color="#080C1A" />
    </linearGradient>
    <linearGradient id="ogPlateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D2A4E" />
      <stop offset="100%" stop-color="#0E1528" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="ogNeonBloom" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ogEyeGlow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="6" result="eyeBlur" />
      <feMerge>
        <feMergeNode in="eyeBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Backing Canvas -->
  <rect width="1200" height="630" fill="url(#ogBgGlow)" />

  <!-- Cyber Matrix Background Grid Lines -->
  <g opacity="0.08" stroke="#43F5FF" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="490" x2="1200" y2="490" />
    <line x1="0" y1="560" x2="1200" y2="560" />

    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
  </g>

  <!-- Frame Chamfer Accent Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#162242" stroke-width="2" fill="none" />
  <path d="M 24,64 L 64,24 M 1136,24 L 1176,64 M 24,566 L 64,606 M 1136,606 L 1176,566" stroke="#00F5FF" stroke-width="2.5" opacity="0.7" />

  <!-- LEFT FLANK: THE APEX CYBER-VIPER EMBLEM -->
  <g transform="translate(70, 75) scale(0.95)">
    <!-- Ambient Under-Glow Aura -->
    <g opacity="0.4" filter="url(#ogNeonBloom)">
      <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
        stroke="#00F5FF" stroke-width="8" fill="none" />
    </g>

    <!-- Armor Shell -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
      fill="url(#ogPlateDark)" stroke="#223156" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Left & Right Temple Shields -->
    <polygon points="194,106 242,126 226,176 150,154" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="318,106 270,126 286,176 362,154" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />

    <!-- Hood Flairs -->
    <polygon points="138,168 212,188 194,244 112,230" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="374,168 300,188 318,244 400,230" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />

    <!-- Lower Jaw Flanks & Body Arcs -->
    <polygon points="112,256 160,268 144,324 100,286" fill="url(#ogPlateDark)" stroke="#223156" stroke-width="2" />
    <polygon points="400,256 352,268 368,324 412,286" fill="url(#ogPlateDark)" stroke="#223156" stroke-width="2" />
    <path d="M 126,334 L 160,378 L 198,414 L 182,428 L 138,390 L 112,348 Z" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <path d="M 386,334 L 352,378 L 314,414 L 330,428 L 374,390 L 400,348 Z" fill="url(#ogPlateMid)" stroke="#2E4172" stroke-width="2.5" />
    <polygon points="256,488 226,456 242,442 256,454 270,442 286,456" fill="#7928CA" stroke="#A779E9" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Kinetic Spine Chevrons -->
    <polygon points="256,76 226,124 244,132 256,114 268,132 286,124"
      fill="url(#ogCyan)" stroke="#A5F9FF" stroke-width="2" stroke-linejoin="round" filter="url(#ogEyeGlow)" />
    <polygon points="240,146 272,146 278,172 234,172" fill="#0C1326" stroke="url(#ogCyan)" stroke-width="2.5" />
    <line x1="256" y1="146" x2="256" y2="172" stroke="#43F5FF" stroke-width="2.5" />
    <polygon points="232,184 280,184 286,210 226,210" fill="#0C1326" stroke="url(#ogCyan)" stroke-width="2.5" />
    <line x1="256" y1="184" x2="256" y2="210" stroke="#43F5FF" stroke-width="2.5" />

    <!-- Snout Hexagon Plate -->
    <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" fill="#090E1D" stroke="url(#ogCyan)" stroke-width="3" />
    <line x1="256" y1="230" x2="256" y2="330" stroke="#A5F9FF" stroke-width="2.5" />
    <circle cx="256" cy="330" r="3.5" fill="#43F5FF" />

    <!-- Predator Optical Sensors (Eyes) -->
    <g filter="url(#ogEyeGlow)">
      <polygon points="164,238 226,252 208,276 150,260" fill="#060812" stroke="#FF007A" stroke-width="2.5" />
      <polygon points="172,246 218,256 204,270 160,258" fill="url(#ogMagenta)" />
      <polygon points="186,250 200,254 192,264 182,260" fill="#FFFFFF" />

      <polygon points="348,238 286,252 304,276 362,260" fill="#060812" stroke="#FF007A" stroke-width="2.5" />
      <polygon points="340,246 294,256 308,270 352,258" fill="url(#ogMagenta)" />
      <polygon points="326,250 312,254 320,264 330,260" fill="#FFFFFF" />
    </g>

    <!-- Fangs -->
    <polygon points="202,382 228,384 218,446" fill="#F0F8FF" stroke="url(#ogCyan)" stroke-width="2.5" />
    <line x1="216" y1="384" x2="218" y2="440" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="218" cy="442" r="2.5" fill="#43F5FF" filter="url(#ogEyeGlow)" />

    <polygon points="310,382 284,384 294,446" fill="#F0F8FF" stroke="url(#ogCyan)" stroke-width="2.5" />
    <line x1="296" y1="384" x2="294" y2="440" stroke="#00F5FF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="294" cy="442" r="2.5" fill="#43F5FF" filter="url(#ogEyeGlow)" />

    <!-- Neon Rim Strokes -->
    <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310" stroke="url(#ogCyan)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 256,44 L 328,96 L 372,150 L 406,218 L 420,252 L 386,310" stroke="url(#ogCyan)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="92" y1="252" x2="60" y2="242" stroke="#00F5FF" stroke-width="2.5" />
    <circle cx="60" cy="242" r="2.5" fill="#43F5FF" />
    <line x1="420" y1="252" x2="452" y2="242" stroke="#00F5FF" stroke-width="2.5" />
    <circle cx="452" cy="242" r="2.5" fill="#43F5FF" />
    <path d="M 228,386 L 256,348 L 284,386" stroke="#9865FF" stroke-width="3" fill="none" />
  </g>

  <!-- RIGHT FLANK: BRAND HEADLINE & SPECIFICATION MATRIX -->
  <g transform="translate(600, 100)">
    <!-- Top System Category Badge -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="280" height="28" rx="6" fill="#00F5FF" fill-opacity="0.1" stroke="#00F5FF" stroke-opacity="0.35" />
      <circle cx="16" cy="14" r="4" fill="#10FFA0" />
      <text x="30" y="19" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="0.2em" fill="#00F5FF">
        CYBERNETIC ARCADE ACTION
      </text>
    </g>

    <!-- Main Game Title: NEON SNAKE -->
    <text x="0" y="130" font-family="'Orbitron', sans-serif" font-weight="900" font-size="72" letter-spacing="0.12em" fill="#FFFFFF" filter="url(#ogNeonBloom)">
      <tspan fill="url(#ogCyan)">NEON</tspan> <tspan fill="#F8FAFC">SNAKE</tspan>
    </text>

    <!-- Tagline Bar: [ ── ONE MORE RUN ── ] -->
    <g transform="translate(0, 190)">
      <path d="M 0,-14 L -12,-14 L -12,14 L 0,14" stroke="#43F5FF" stroke-width="3" fill="none" />
      <circle cx="-12" cy="0" r="2.5" fill="#43F5FF" />
      <text x="10" y="8" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="34" letter-spacing="0.32em" fill="#C7D2FE">
        ONE MORE RUN
      </text>
      <path d="M 380,-14 L 392,-14 L 392,14 L 380,14" stroke="#43F5FF" stroke-width="3" fill="none" />
      <circle cx="392" cy="0" r="2.5" fill="#43F5FF" />
    </g>

    <!-- Divider Rail -->
    <line x1="0" y1="240" x2="520" y2="240" stroke="#1D2A4C" stroke-width="2" />
    <line x1="0" y1="240" x2="160" y2="240" stroke="url(#ogCyan)" stroke-width="3" />

    <!-- Feature Pillars -->
    <g transform="translate(0, 280)">
      <!-- Pillar 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="245" height="42" rx="8" fill="#0C1326" stroke="#1E2B4E" stroke-width="1.5" />
        <circle cx="16" cy="21" r="3" fill="#43F5FF" />
        <text x="28" y="26" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="16" letter-spacing="0.08em" fill="#E2E8F0">
          CLASSIC · ZEN · RUSH MODES
        </text>
      </g>

      <!-- Pillar 2 -->
      <g transform="translate(260, 0)">
        <rect x="0" y="0" width="250" height="42" rx="8" fill="#0C1326" stroke="#1E2B4E" stroke-width="1.5" />
        <circle cx="16" cy="21" r="3" fill="#FF007A" />
        <text x="28" y="26" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="16" letter-spacing="0.08em" fill="#E2E8F0">
          TACTICAL SHIELD &amp; SLOW-MO
        </text>
      </g>

      <!-- Pillar 3 -->
      <g transform="translate(0, 54)">
        <rect x="0" y="0" width="245" height="42" rx="8" fill="#0C1326" stroke="#1E2B4E" stroke-width="1.5" />
        <circle cx="16" cy="21" r="3" fill="#9865FF" />
        <text x="28" y="26" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="16" letter-spacing="0.08em" fill="#E2E8F0">
          VIRTUAL D-PAD &amp; SWIPES
        </text>
      </g>

      <!-- Pillar 4 -->
      <g transform="translate(260, 54)">
        <rect x="0" y="0" width="250" height="42" rx="8" fill="#0C1326" stroke="#1E2B4E" stroke-width="1.5" />
        <circle cx="16" cy="21" r="3" fill="#10FFA0" />
        <text x="28" y="26" font-family="'Rajdhani', sans-serif" font-weight="700" font-size="16" letter-spacing="0.08em" fill="#E2E8F0">
          PROCEDURAL AUDIO SYNTH
        </text>
      </g>
    </g>

    <!-- Bottom Technical Spec -->
    <text x="0" y="420" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.3em" fill="#64748B">
      CROSS-PLATFORM ARCHITECTURE // HTML5 · VITE · CAPACITOR
    </text>
  </g>
</svg>
