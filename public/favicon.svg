<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Cyan Neon Gradients -->
    <linearGradient id="favCyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43F5FF" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <!-- Magenta Eye Laser Gradients -->
    <linearGradient id="favMagentaLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" />
      <stop offset="50%" stop-color="#FF2E93" />
      <stop offset="100%" stop-color="#FF70BA" />
    </linearGradient>

    <!-- Deep Shading for Contrast -->
    <linearGradient id="favPlateDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141A30" />
      <stop offset="100%" stop-color="#0A0D1A" />
    </linearGradient>
    <linearGradient id="favPlateMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2746" />
      <stop offset="100%" stop-color="#0F1424" />
    </linearGradient>
    <linearGradient id="favViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9865FF" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
  </defs>

  <!-- Circular/Squircle Backing for Tab Contrast on Light or Dark Browsers -->
  <rect width="512" height="512" rx="112" fill="#060914" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#162242" stroke-width="4" fill="none" />

  <!-- Outer Neon Glow -->
  <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
    stroke="#00F5FF" stroke-width="8" stroke-opacity="0.45" fill="none" />

  <!-- Main Armor Shell -->
  <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310 L 168,362 L 204,396 L 218,446 L 228,386 L 256,348 L 284,386 L 294,446 L 308,396 L 344,362 L 386,310 L 420,252 L 406,218 L 372,150 L 328,96 Z"
    fill="url(#favPlateDark)" stroke="#1E2746" stroke-width="3" stroke-linejoin="round" />

  <!-- Left & Right Temple Shield Plates -->
  <polygon points="194,106 242,126 226,176 150,154" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" stroke-linejoin="round" />
  <polygon points="318,106 270,126 286,176 362,154" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" stroke-linejoin="round" />

  <!-- Left & Right Flared Hood Plates -->
  <polygon points="138,168 212,188 194,244 112,230" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" stroke-linejoin="round" />
  <polygon points="374,168 300,188 318,244 400,230" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" stroke-linejoin="round" />

  <!-- Lower Jaw Flank Plates -->
  <polygon points="112,256 160,268 144,324 100,286" fill="url(#favPlateDark)" stroke="#2D3A66" stroke-width="1.5" />
  <polygon points="400,256 352,268 368,324 412,286" fill="url(#favPlateDark)" stroke="#2D3A66" stroke-width="1.5" />

  <!-- Collar Segments -->
  <path d="M 126,334 L 160,378 L 198,414 L 182,428 L 138,390 L 112,348 Z" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" />
  <path d="M 386,334 L 352,378 L 314,414 L 330,428 L 374,390 L 400,348 Z" fill="url(#favPlateMid)" stroke="#2D3A66" stroke-width="2" />
  <polygon points="256,488 226,456 242,442 256,454 270,442 286,456" fill="url(#favViolet)" stroke="#B388FF" stroke-width="2" stroke-linejoin="round" />

  <!-- Kinetic Spinal Chevrons -->
  <polygon points="256,76 226,124 244,132 256,114 268,132 286,124" fill="url(#favCyberCyan)" stroke="#A5F9FF" stroke-width="2" stroke-linejoin="round" />
  <polygon points="240,146 272,146 278,172 234,172" fill="#0F172E" stroke="url(#favCyberCyan)" stroke-width="2" />
  <line x1="256" y1="146" x2="256" y2="172" stroke="#43F5FF" stroke-width="2" />
  <polygon points="232,184 280,184 286,210 226,210" fill="#0F172E" stroke="url(#favCyberCyan)" stroke-width="2" />
  <line x1="256" y1="184" x2="256" y2="210" stroke="#43F5FF" stroke-width="2" />

  <!-- Snout Hexagon Plate -->
  <polygon points="256,222 282,256 278,312 256,338 234,312 230,256" fill="#0A0E1C" stroke="url(#favCyberCyan)" stroke-width="2.5" />
  <line x1="256" y1="230" x2="256" y2="330" stroke="#A5F9FF" stroke-width="2" />
  <circle cx="256" cy="330" r="3" fill="#43F5FF" />

  <!-- Predator Optical Sensors (Eyes) -->
  <polygon points="164,238 226,252 208,276 150,260" fill="#060812" stroke="#FF007A" stroke-width="2" />
  <polygon points="172,246 218,256 204,270 160,258" fill="url(#favMagentaLaser)" />
  <polygon points="186,250 200,254 192,264 182,260" fill="#FFFFFF" />

  <polygon points="348,238 286,252 304,276 362,260" fill="#060812" stroke="#FF007A" stroke-width="2" />
  <polygon points="340,246 294,256 308,270 352,258" fill="url(#favMagentaLaser)" />
  <polygon points="326,250 312,254 320,264 330,260" fill="#FFFFFF" />

  <!-- Fangs -->
  <polygon points="202,382 228,384 218,446" fill="#F0F8FF" stroke="url(#favCyberCyan)" stroke-width="2" />
  <line x1="216" y1="384" x2="218" y2="440" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />
  <polygon points="310,382 284,384 294,446" fill="#F0F8FF" stroke="url(#favCyberCyan)" stroke-width="2" />
  <line x1="296" y1="384" x2="294" y2="440" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" />

  <!-- Neon Rim Strokes -->
  <path d="M 256,44 L 184,96 L 140,150 L 106,218 L 92,252 L 126,310" stroke="url(#favCyberCyan)" stroke-width="3" stroke-linecap="round" />
  <path d="M 256,44 L 328,96 L 372,150 L 406,218 L 420,252 L 386,310" stroke="url(#favCyberCyan)" stroke-width="3" stroke-linecap="round" />
  <path d="M 228,386 L 256,348 L 284,386" stroke="#9865FF" stroke-width="2.5" fill="none" />
</svg>
